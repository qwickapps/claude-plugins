name: Deploy __APP_NAME__

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    paths-ignore:
      - '*.md'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
        default: dev

concurrency:
  group: deploy-__APP_NAME__-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: __GITHUB_OWNER__
  HEALTH_PATH: __HEALTH_PATH__

jobs:
  # ─── Phase 0: Compute environment, names, and URLs ───
  prepare:
    runs-on: self-hosted
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      app_name: ${{ steps.meta.outputs.app_name }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      tag: ${{ steps.meta.outputs.tag }}
      app_url: ${{ steps.urls.outputs.app_url }}
      gateway_app_name: ${{ steps.urls.outputs.gateway_app_name }}
      target_app_url: ${{ steps.urls.outputs.target_app_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif echo "${{ github.ref }}" | grep -q '^refs/tags/v'; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=uat" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate image metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${VERSION}.${{ github.run_number }}"
          ENV="${{ steps.env.outputs.environment }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/__APP_NAME__-${ENV}:${TAG}"

          if [ "$ENV" = "prod" ]; then
            APP_NAME="__APP_NAME__"
          elif [ "$ENV" = "uat" ]; then
            APP_NAME="__APP_NAME__-uat"
          else
            SHORT_SHA=$(echo "$GITHUB_SHA" | head -c 7)
            APP_NAME="__APP_NAME__-${SHORT_SHA}"
          fi

          echo "image_ref=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Derive URLs
        id: urls
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          APP_NAME="${{ steps.meta.outputs.app_name }}"
          SHORT_SHA=$(echo "$GITHUB_SHA" | head -c 7)

          if [ "$ENV" = "prod" ]; then
            APP_URL="https://__APP_NAME__.app.qwickforge.com"
            GATEWAY_APP_NAME="__APP_NAME__"
            TARGET_APP="${APP_NAME}.app.qwickforge.com"
          elif [ "$ENV" = "uat" ]; then
            APP_URL="https://__APP_NAME__-uat.app.qwickforge.com"
            GATEWAY_APP_NAME="__APP_NAME__-uat"
            TARGET_APP="${APP_NAME}.app.qwickforge.com"
          else
            APP_URL="https://__APP_NAME__-${SHORT_SHA}.dev.qwickforge.com"
            GATEWAY_APP_NAME="__APP_NAME__-dev"
            TARGET_APP="__APP_NAME__-${SHORT_SHA}.dev.qwickforge.com"
          fi

          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"
          echo "gateway_app_name=${GATEWAY_APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "target_app_url=https://${TARGET_APP}" >> "$GITHUB_OUTPUT"

  # ─── Phase 1: Build, provision app, and provision gateway run in PARALLEL ───

  build:
    needs: prepare
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ needs.prepare.outputs.image_ref }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/__APP_NAME__-${{ needs.prepare.outputs.environment }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  provision-app:
    needs: prepare
    runs-on: self-hosted
    concurrency:
      group: caprover-deploy-app
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x .github/scripts/*.sh

      - name: Write env file
        run: |
          printf '%s\n' \
            'NODE_ENV=production' \
            'PORT=__CONTAINER_PORT__' \
            > /tmp/app.env

      - name: Configure CapRover app
        env:
          CAPROVER_URL: ${{ needs.prepare.outputs.environment == 'dev' && secrets.OCI_DEV_CAPROVER_URL || secrets.CAPROVER_URL }}
          CAPROVER_PASSWORD: ${{ needs.prepare.outputs.environment == 'dev' && secrets.OCI_DEV_CAPROVER_PASSWORD || secrets.CAPROVER_PASSWORD }}
        run: |
          .github/scripts/configure-caprover-app.sh \
            --app-name "${{ needs.prepare.outputs.app_name }}" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD" \
            --container-port __CONTAINER_PORT__ \
            --env-file /tmp/app.env

  provision-gateway:
    needs: prepare
    runs-on: self-hosted
    concurrency:
      group: caprover-deploy-gateway
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x .github/scripts/*.sh

      - name: Provision QwickWay route
        run: |
          .github/scripts/setup-qwickway-route.sh \
            --gateway-app-name "${{ needs.prepare.outputs.gateway_app_name }}" \
            --target-app-url "${{ needs.prepare.outputs.target_app_url }}" \
            --route-caprover-url "${{ secrets.ROUTE_CAPROVER_URL }}" \
            --route-caprover-password "${{ secrets.ROUTE_CAPROVER_PASSWORD }}" \
            --health-check-path "${{ env.HEALTH_PATH }}" \
            --github-token "${{ secrets.GHCR_PULL_TOKEN }}" \
            --github-owner "__GITHUB_OWNER__"

  # ─── Phase 2: Deploy image and verify health ───

  deploy-and-verify:
    needs: [prepare, build, provision-app, provision-gateway]
    runs-on: self-hosted
    concurrency:
      group: caprover-deploy-app
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x .github/scripts/*.sh

      - name: Deploy from GHCR
        env:
          CAPROVER_URL: ${{ needs.prepare.outputs.environment == 'dev' && secrets.OCI_DEV_CAPROVER_URL || secrets.CAPROVER_URL }}
          CAPROVER_PASSWORD: ${{ needs.prepare.outputs.environment == 'dev' && secrets.OCI_DEV_CAPROVER_PASSWORD || secrets.CAPROVER_PASSWORD }}
        run: |
          .github/scripts/deploy-from-ghcr.sh \
            --app-name "${{ needs.prepare.outputs.app_name }}" \
            --image-ref "${{ needs.prepare.outputs.image_ref }}" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD" \
            --github-token "${{ secrets.GHCR_PULL_TOKEN }}" \
            --github-owner "${{ env.OWNER }}"

      - name: Validate app health
        env:
          CAPROVER_URL: ${{ needs.prepare.outputs.environment == 'dev' && secrets.OCI_DEV_CAPROVER_URL || secrets.CAPROVER_URL }}
          CAPROVER_PASSWORD: ${{ needs.prepare.outputs.environment == 'dev' && secrets.OCI_DEV_CAPROVER_PASSWORD || secrets.CAPROVER_PASSWORD }}
        run: |
          .github/scripts/validate-deployment-health.sh \
            --app-name "${{ needs.prepare.outputs.app_name }}" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD" \
            --app-url "${{ needs.prepare.outputs.app_url }}" \
            --health-path "${{ env.HEALTH_PATH }}"

  # ─── Phase 3: Cleanup old dev builds ───

  cleanup-dev:
    needs: [prepare, deploy-and-verify]
    runs-on: self-hosted
    if: needs.prepare.outputs.environment == 'dev'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x .github/scripts/*.sh

      - name: Clean up old dev builds
        run: |
          .github/scripts/cleanup-dev-builds.sh \
            --app-name-prefix "__APP_NAME__" \
            --caprover-url "${{ secrets.OCI_DEV_CAPROVER_URL }}" \
            --caprover-password "${{ secrets.OCI_DEV_CAPROVER_PASSWORD }}" \
            --route-caprover-url "${{ secrets.ROUTE_CAPROVER_URL }}" \
            --route-caprover-password "${{ secrets.ROUTE_CAPROVER_PASSWORD }}" \
            --gateway-app-name "__APP_NAME__-dev"
